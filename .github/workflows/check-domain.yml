# Временная проверка домена: DNS-записи и ответ сайта. Запуск вручную (Actions → Check domain).
name: Check domain
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=xn--80acmogcvipsi.xn--p1ai
          echo "== A @ns1.reg.ru"; dig +short A $D @ns1.reg.ru
          echo "== www @ns1.reg.ru"; dig +short www.$D @ns1.reg.ru
          echo "== NS (зона рф)"; dig +short NS $D @a.dns.ripn.net
          echo "== NS"; dig +short NS $D
          echo "== A (Google)"; dig +short A $D @8.8.8.8
          echo "== A (Yandex)"; dig +short A $D @77.88.8.8
          echo "== AAAA"; dig +short AAAA $D @8.8.8.8
          echo "== www"; dig +short www.$D @8.8.8.8
          echo "== HTTP"; curl -sS -m 20 -o /dev/null -w "%{http_code} %{redirect_url}\n" http://$D/ || true
          echo "== HTTPS"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" https://$D/ || true
          echo "== BODY"; curl -sS -m 20 http://$D/ | grep -oE "<title>[^<]*|There isn.t a GitHub Pages site here|Site not found|DNS check" | head -3 || true
          echo "== www"; curl -sS -m 20 -o /dev/null -w "%{http_code} %{redirect_url}\n" http://www.$D/ || true
          echo "== HTTP headers"; curl -sS -m 20 -I http://$D/ | head -8 || true
          sudo apt-get install -y -qq whois >/dev/null 2>&1 || true
          echo "== whois"; whois -h whois.tcinet.ru $D 2>&1 | grep -vE "^%|^$" | head -20 || true
