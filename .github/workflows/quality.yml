name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability report
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=commonjs <<'NODE'
          const report = require(process.env.RUNNER_TEMP + '/npm-audit.json');
          const vulnerabilities = Object.entries(report.vulnerabilities || {});
          console.log('Dependency audit summary:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of vulnerabilities) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              installedPaths: item.nodes,
              fixAvailable: item.fixAvailable,
              advisories: item.via.map(v => typeof v === 'string' ? v : {
                title: v.title, url: v.url, range: v.range
              })
            }));
          }
          NODE
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        env:
          SITE_URL: https://xn--80acmogcvipsi.xn--p1ai
        run: npx vite build --base /
      - name: SEO smoke tests
        run: node tests/seo-pages.cjs dist
      - name: Prerender
        run: node scripts/prerender.cjs dist /
      - name: Install redesigned homepage
        run: python3 redesign/tools/install.py dist
      - name: Browser smoke tests for final site output
        run: node tests/redesign-smoke.cjs dist
