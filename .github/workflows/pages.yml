# Публикация сайта на GitHub Pages при каждом сохранении в main.
# Включите один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # раз в сутки (00:05 по Ульяновску): обновляет отсчёт дней в сезонной полосе в готовой разметке
  schedule:
    - cron: '5 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Адрес сайта берётся из настроек Pages: свой домен (слопайбукет.рф) → корень «/»,
      # без домена → https://<логин>.github.io/<репозиторий>/. Менять здесь ничего не нужно.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Сгенерировать данные каталога редизайна
        run: python3 redesign/tools/build-data.py
      - name: Сборка
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npx vite build --base "${{ steps.pages.outputs.base_path }}/"
      - name: Проверка SEO-страниц, sitemap и изображений
        run: node tests/seo-pages.cjs dist
      - name: Пререндер (готовая разметка для поисковиков и быстрого первого экрана)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/prerender.cjs dist "${{ steps.pages.outputs.base_path }}/"
      # Новая главная (redesign/) поверх собранного сайта. Откат на старую — удалить этот шаг.
      - name: Новая главная
        run: python3 redesign/tools/install.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
