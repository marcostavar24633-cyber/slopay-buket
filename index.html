    <!-- Яндекс Метрика запускается только после явного согласия посетителя. -->
    <script>
      (function () {
        'use strict';
        var KEY = 'slopay-analytics-consent';
        function startAnalytics() {
          if (window.__slopayAnalyticsStarted || navigator.webdriver || /[?&]edit=1/.test(location.search)) return;

        }
        var choice = '';
        try { choice = localStorage.getItem(KEY) || ''; } catch (e) {}
        document.addEventListener('DOMContentLoaded', function () {
          var panel = document.querySelector('.cookie-consent');
          if (choice === 'accepted') {
            if (panel) panel.remove();
            startAnalytics();
            return;
          }
          if (choice === 'rejected') {
            if (panel) panel.remove();
            return;
          }
          if (!panel) return;
          panel.hidden = false;
          panel.addEventListener('click', function (event) {
            var button = event.target.closest('button[data-choice]');
            if (!button) return;
            var accepted = button.getAttribute('data-choice') === 'accept';
            try { localStorage.setItem(KEY, accepted ? 'accepted' : 'rejected'); } catch (e) {}
            panel.remove();
            if (accepted) startAnalytics();
          });
        });
      })();
    </script>
    <!-- Цели Метрики: один обработчик на все ссылки MAX, Telegram, телефон, Авито и PDF -->
    <script>

        var ID = 114134059, href = el.getAttribute('href') || '';
